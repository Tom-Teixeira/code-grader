version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: codegrader
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: codegrader
    ports:
      - "5173:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  codegrader-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - codegrader_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://codegrader:mypassword@db:5432/codegrader
    depends_on:
      - db
volumes:
  codegrader_node_modules:
  db_data:
